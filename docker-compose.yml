# Local development database only. Not a deployment configuration.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mda
      POSTGRES_DB: mda
      POSTGRES_PASSWORD: ${MDA_DB_PASSWORD:?set MDA_DB_PASSWORD in .env next to this file}
    ports:
      - "127.0.0.1:5432:5432"   # bound to localhost only
    volumes:
      - mda_pg:/var/lib/postgresql/data
      - ./backend/scripts/create-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
volumes:
  mda_pg:
